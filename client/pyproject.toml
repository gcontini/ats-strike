[project]
name = "ats-strike-client"
version = "1.0.0"
description = "ats-strike CLI: clipboard/watch/submit/render against an ats-strike server."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "ats-strike-contracts",
    # The only transport. Everything else here is local I/O.
    "httpx>=0.27",
    # Clipboard mode.
    "pyperclip",
    # applications.xlsx tracking.
    "openpyxl",
]

[project.scripts]
cv = "cv_client.cli:main"

[tool.uv.sources]
ats-strike-contracts = { workspace = true }

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cv_client.resources" = ["*.xlsx"]
