[project]
name = "resumix-client"
version = "0.5.4"
description = "resumix CLI: clipboard/watch/submit/render against a resumix server."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "resumix-contracts",
    # The only transport. Everything else here is local I/O.
    "httpx>=0.27",
    # Clipboard mode.
    "pyperclip",
    # applications.xlsx tracking.
    "openpyxl",
]

[project.scripts]
resumix = "resumix_client.cli:main"

[tool.uv.sources]
resumix-contracts = { workspace = true }

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"resumix_client.resources" = ["*.xlsx"]
