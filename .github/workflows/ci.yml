name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push makes the previous run's artifacts obsolete; do not pay for them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job here only reads the repo, builds and tests — none of them talk
# to the GitHub API.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # The renderer tests compile a real CV; without these they skip
      # themselves and the golden render would be the only thing checked.
      - name: Install the LaTeX toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends
             texlive-latex-base texlive-fonts-extra cm-super
      - run: uv sync --frozen
      - run: uv run pytest -q --cov --cov-report=xml

      # Coverage, not code quality: Codacy's own static analysis runs
      # separately from a repo-linked GitHub App and reads .codacy.yml for
      # its exclusions. This just reports what the tests actually covered.
      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml

  # The site is part of a release now, and mkdocs.yml is `strict: true`, so a
  # broken internal link has to fail here rather than half way through one.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv run --group docs mkdocs build --strict

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Classic builder, as everywhere else: the Dockerfile must stay
      # buildable without BuildKit.
      - name: Build the server image
        run: DOCKER_BUILDKIT=0 docker build -t resumix-server .
      - name: Start it and check it is healthy
        run: |
          docker run -d --name api -p 8080:8080 \
            -e MODEL_API_KEY=ci -e MODEL_BASE_URL=http://invalid/v1 \
            -e MODEL_API_KEY2=ci -e MODEL_BASE_URL2=http://invalid/v1 \
            resumix-server
          for i in $(seq 1 30); do
            curl -fsS localhost:8080/healthz && break || sleep 2
          done
          curl -fsS localhost:8080/healthz | grep '"pdflatex":true'

  client:
    # PyInstaller does not cross-compile: each binary is built on its own OS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen

      # PyInstaller re-analyses every dependency from scratch otherwise; the
      # key carries the spec and the lock because either one invalidates it.
      - name: Cache the PyInstaller analysis
        uses: actions/cache@v6
        with:
          path: build
          key: pyinstaller-${{ matrix.os }}-${{ hashFiles('uv.lock', 'client/packaging/resumix.spec') }}

      - name: Build the executable
        run: uv run --with pyinstaller pyinstaller --noconfirm client/packaging/resumix.spec

      - name: Check it runs
        run: |
          ./dist/resumix --help
          ./dist/resumix version
        shell: bash

      # The real question is not "does it start" but "does it talk to a
      # server". The server from this same checkout is enough, and cheaper
      # than the image, which the `image` job builds anyway.
      - name: Install a minimal LaTeX for the smoke test
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends
             texlive-latex-base

      - name: Render a PDF through a running server
        if: runner.os == 'Linux'
        env:
          MODEL_API_KEY: ci
          MODEL_BASE_URL: http://invalid/v1
          # The CV steps call provider 2, and every role is built at startup.
          MODEL_API_KEY2: ci
          MODEL_BASE_URL2: http://invalid/v1
          PORT: "8080"
          # The runner's /tmp is shared and holds unreadable directories;
          # the server should not have to scan it at all.
          RESUMIX_WORK_DIR: ${{ runner.temp }}/resumix-work
        run: |
          set -eux
          uv run resumix-api &
          for i in $(seq 1 30); do
            curl -fsS localhost:8080/healthz && break || sleep 2
          done
          printf '%s\n' \
            '\documentclass{article}' \
            '\begin{document}Hello from CI.\end{document}' > smoke.tex
          # No model is reachable here, and render needs none: this is
          # multipart in, envelope out, pdflatex, base64 back, PDF on disk.
          ./dist/resumix -v --server http://localhost:8080 render smoke.tex
          head -c 4 smoke.pdf | grep -q '%PDF'
          rm -f smoke.tex smoke.pdf
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.os }}
          path: dist/resumix*
          retention-days: 30
          if-no-files-found: error
