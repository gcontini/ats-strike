name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push makes the previous run's artifacts obsolete; do not pay for them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job here only reads the repo, builds and tests — none of them talk
# to the GitHub API.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # The renderer tests compile a real CV; without these they skip
      # themselves and the golden render would be the only thing checked.
      - name: Install the LaTeX toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends
             texlive-latex-base texlive-fonts-extra cm-super
      - run: uv sync --frozen
      - run: uv run pytest -q --cov --cov-report=xml

      # Coverage, not code quality: Codacy's own static analysis runs
      # separately from a repo-linked GitHub App and reads .codacy.yml for
      # its exclusions. This just reports what the tests actually covered.
      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml

  # The site is part of a release now, and mkdocs.yml is `strict: true`, so a
  # broken internal link has to fail here rather than half way through one.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv run --group docs mkdocs build --strict

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Classic builder, as everywhere else: the Dockerfile must stay
      # buildable without BuildKit.
      - name: Build the server image
        run: DOCKER_BUILDKIT=0 docker build -t resumix-server .
      - name: Start it and check it is healthy
        run: |
          docker run -d --name api -p 8080:8080 \
            -e MODEL_API_KEY=ci -e MODEL_BASE_URL=http://invalid/v1 \
            resumix-server
          for i in $(seq 1 30); do
            curl -fsS localhost:8080/healthz && break || sleep 2
          done
          curl -fsS localhost:8080/healthz | grep '"pdflatex":true'
