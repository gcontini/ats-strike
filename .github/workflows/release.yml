name: Release

# One version for the whole repository. You type it here; this writes it into
# the three pyprojects and the lock, tags it, and builds the server image from
# that tag. The client is released from main, and talks to this server too.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "MAJOR.MINOR.PATCH, no leading v"
        required: true
        type: string

# Pushing the bump commit, the tag, and creating the release. The repository
# default for GITHUB_TOKEN is read-only, so this has to ask.
permissions:
  contents: write

# Two releases must never interleave. No cancel-in-progress: a half-cancelled
# release is the one state worth avoiding.
concurrency: release

jobs:
  # The version becomes a commit and a tag. Everything after this builds from
  # that tag, so an image cannot claim a version it was not built at.
  tag:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The push below is a fast-forward of one commit; a shallow clone is
          # one more thing that can refuse it. This repository is small.
          fetch-depth: 0

      - name: Check the version and the branch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          # 0.5.N only: the image shares its repository with the 1.x releases,
          # and anything else would be tagged 0.5-latest, or deployed as a 1.x.
          echo "$VERSION" | grep -Eq '^0\.5\.[0-9]+$' \
            || { echo "version must be 0.5.PATCH on this branch, got '$VERSION'"; exit 1; }
          [ "$GITHUB_REF" = refs/heads/fix-0.5.x ] \
            || { echo "release from fix-0.5.x only, dispatched from $GITHUB_REF"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION already exists"; exit 1
          fi

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Write the version everywhere
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eux
          sed -i "s/^version = \".*\"$/version = \"$VERSION\"/" \
            contracts/pyproject.toml pipeline/pyproject.toml server/pyproject.toml
          # uv.lock records each member's version too. Leaving it stale would
          # commit a lock that disagrees with the manifests, and `uv lock
          # --check` and `uv sync --locked` both refuse that.
          uv lock
          grep -H '^version = ' \
            contracts/pyproject.toml pipeline/pyproject.toml server/pyproject.toml

      - name: Commit, tag and push
        id: push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eux
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/pyproject.toml pipeline/pyproject.toml server/pyproject.toml uv.lock
          git commit -m "release v$VERSION"
          git tag "v$VERSION"
          # --atomic: the branch and the tag land together, or neither does.
          git push --atomic origin HEAD:fix-0.5.x "refs/tags/v$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The server image, from the same commit. Classic builder, linux/amd64,
  # plain docker push — see AGENTS.md. Only the Alibaba registry, the one
  # Function Compute deploys from: this is the 0.5.x line, not the public
  # image, so nothing goes to Docker Hub and nothing is tagged latest. It is
  # tagged 0.5.N and 0.5-latest, one image under two names: server/terraform
  # follows 0.5-latest to its digest and deploys the 0.5.N that shares it,
  # because Function Compute must never be given a tag that moves.
  image:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}

      - name: Build it
        env:
          ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
          VERSION: ${{ inputs.version }}
        run: DOCKER_BUILDKIT=0 docker build
             -t "$ACR_REPOSITORY:$VERSION" -t "$ACR_REPOSITORY:0.5-latest" .

      # CI's healthz check, plus the version: the image installs from the lock
      # with --no-editable, so this is what proves the lock was regenerated.
      - name: Start it and check what it reports
        env:
          ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eux
          docker run -d --name api -p 8080:8080 \
            -e MODEL_API_KEY=ci -e MODEL_BASE_URL=http://invalid/v1 \
            "$ACR_REPOSITORY:$VERSION"
          for i in $(seq 1 30); do
            curl -fsS localhost:8080/healthz && break || sleep 2
          done
          curl -fsS localhost:8080/healthz > health.json
          cat health.json
          grep -q '"pdflatex":true' health.json
          grep -qF "\"version\":\"$VERSION\"" health.json

      # Login last: a broken image never reaches the registry, and the
      # credentials are not sitting on the runner during the long build.
      - name: Push it
        env:
          ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          echo "$ACR_PASSWORD" | docker login -u "$ACR_USERNAME" --password-stdin "${ACR_REPOSITORY%%/*}"
          # The version first: 0.5-latest must never name an image that has no
          # 0.5.N in the registry yet.
          docker push "$ACR_REPOSITORY:$VERSION"
          docker push "$ACR_REPOSITORY:0.5-latest"
