# ats-strike — the CV server, as one project.
#
#   src/contracts/      the wire format server and client agree on (pydantic
#                       only): the ats-strike-contract repository, as a git
#                       submodule, installed as a path dependency
#   src/common/         what the pipelines share: the models, observability,
#                       errors, the highlighter, the validation loop, the renderer
#   src/pipeline_v1/    everything that makes a CV: LLM calls + pdflatex; no HTTP
#   src/pipeline_v2/    CV pipeline 2.0, beside v1: a store compiled once per
#                       profile, a CV per job from it; a library on common
#   src/cv_server/      the HTTP API in front of the pipelines, deployed as a
#                       container; one set of routes per pipeline (/v1/..., /v2/...)
#   resources/v1/       the pipeline's prompts, schemas, template and models
#   resources/v2/       pipeline 2.0's prompts, template, market list and models
#   resources/docker/   the image's scripts and vendored fonts, compose.yaml
#
# The client is the ats-strike-client repository, and the tests that run the
# two together are ats-integration-tests.
#
# Dependency direction is one-way: contracts <- server -> pipeline_v1,
# pipeline_v2 -> common. The pipelines import none of the others;
# tests/test_architecture.py enforces it.
#
#     uv sync                 install the server and the contracts into .venv
#     uv run pytest           run the contracts' tests and the server's
#     uv run ats-strike       start the server
#     uv run --group docs mkdocs serve   the doc/ site, on localhost:8000

[project]
name = "ats-strike-server"
version = "2.0.3"
description = "ats-strike CV server: the HTTP API (packs, sessions, SSE) and the CV pipeline behind it — a job description and a pack of files in, tailored CV data and a compiled LaTeX PDF out."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "ats-strike-contracts",
    # Every model call goes through LangChain (common/models): ChatOpenAI
    # for any OpenAI-compatible endpoint, ChatDeepSeek for api.deepseek.com.
    "langchain-openai>=1.6",
    "langchain-deepseek>=1.1",
    # The CV pipeline's steps as a graph, with Send for the calls a step makes
    # side by side (pipeline_v1/cv_generator.py).
    "langgraph>=1.2",
    # Still imported directly: the facade turns its errors into kinds.
    "openai",
    # Templating the LaTeX CV.
    "Jinja2",
    # Page counting on the compiled PDF.
    "pypdf",
    # .env secrets for local runs.
    "python-dotenv",
    # Web layer. uvicorn plain, not [standard]: no uvloop/httptools/websockets.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Required for File()/Form() parts — FastAPI raises without it.
    "python-multipart>=0.0.9",
]

[project.scripts]
ats-strike = "cv_server.server:main"

# A path dependency, not a workspace member: with no workspace of its own,
# this project can be a member of ats-integration-tests' workspace.
[tool.uv.sources]
ats-strike-contracts = { path = "src/contracts", editable = true }

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# resources/v1 and resources/v2 live outside src/, so each
# needs its own package-dir entry and an explicit packages list (packages.find
# only scans "where").
[tool.setuptools]
package-dir = { "" = "src", "pipeline_v1.resources" = "resources/v1", "pipeline_v2.resources" = "resources/v2" }
packages = [
    "common",
    "common.models",
    "pipeline_v1",
    "pipeline_v1.resources",
    "pipeline_v2",
    "pipeline_v2.resources",
    "cv_server",
    "cv_server.api",
    "cv_server.api.routers",
]

[tool.setuptools.package-data]
"pipeline_v1.resources" = ["*.txt", "*.json", "*.toml", "*.jinja", "*.png"]
"pipeline_v2.resources" = ["*.txt", "*.json", "*.toml", "*.jinja"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.17.5",
]
# The doc/ site. Material 9 is the last line that works with MkDocs 1.x, and
# MkDocs 2.0 drops the plugin system it is built on, so both are capped.
# mike keeps one built site per release on the gh-pages branch, under a
# version selector; the same cap applies to it, it is a plugin.
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "mike>=2.1,<3"]

# The code is written at 120 columns. The contracts are a submodule: formatted
# in their own repository.
[tool.ruff]
line-length = 120
extend-exclude = ["src/contracts", "doc/protocol.md"]

[tool.pytest.ini_options]
testpaths = ["src/contracts/tests", "tests"]
markers = ["latex: needs a pdflatex binary on PATH"]

# Scoped to the src/ packages, so coverage is measured on library code only —
# no test file ever counts towards its own coverage.
[tool.coverage.run]
source = ["src/contracts/src", "src/common", "src/pipeline_v1", "src/pipeline_v2", "src/cv_server"]
