# ats-strike — a uv workspace with three members.
#
#   contracts/  the wire format both sides agree on (pydantic only)
#   server/     the HTTP API: LLM calls + pdflatex, deployed as a container
#   client/     the CLI, shipped as a single-file executable
#
# Dependency direction is one-way: client -> contracts <- server. Neither side
# imports the other; tests/test_architecture.py enforces it.
#
#     uv sync                 install every member into one .venv
#     uv run pytest           run all three test suites
#     uv run ats-strike       start the server
#     uv run cv --help        the client
#     uv run --group docs mkdocs serve   the doc/ site, on localhost:8000

[tool.uv.workspace]
members = ["contracts", "server", "client"]

[tool.uv.sources]
ats-strike-contracts = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]
# The doc/ site. Material 9 is the last line that works with MkDocs 1.x, and
# MkDocs 2.0 drops the plugin system it is built on, so both are capped.
# mike keeps one built site per release on the gh-pages branch, under a
# version selector; the same cap applies to it, it is a plugin.
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "mike>=2.1,<3"]

[tool.pytest.ini_options]
testpaths = ["contracts/tests", "server/tests", "client/tests", "tests"]
markers = ["latex: needs a pdflatex binary on PATH"]

# Scoped to the three src/ packages, so coverage is measured on library code
# only — no test file ever counts towards its own coverage.
[tool.coverage.run]
source = ["contracts/src", "server/src", "client/src"]
