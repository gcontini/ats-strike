# ats-strike 0.5 — a uv workspace with three members.
#
#   contracts/  the wire format a client and the server agree on (pydantic only)
#   pipeline/   everything that makes a CV: LLM calls + pdflatex; no HTTP
#   server/     the HTTP API in front of the pipeline, deployed as a container
#
# Dependency direction is one-way: contracts <- server -> pipeline. The
# pipeline imports none of the others; tests/test_architecture.py enforces it.
# contracts/ and server/ are copied from main byte for byte: the client lives
# there, and talks to this server and to a 1.x one alike.
#
#     uv sync                 install every member into one .venv
#     uv run pytest           run all three test suites
#     uv run ats-strike       start the server
#     uv run --group docs mkdocs serve   the doc/ site, on localhost:8000

[tool.uv.workspace]
members = ["contracts", "pipeline", "server"]

[tool.uv.sources]
ats-strike-contracts = { workspace = true }
ats-strike-pipeline = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]
# The doc/ site. Material 9 is the last line that works with MkDocs 1.x, and
# MkDocs 2.0 drops the plugin system it is built on, so both are capped.
# mike keeps one built site per release on the gh-pages branch, under a
# version selector; the same cap applies to it, it is a plugin.
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "mike>=2.1,<3"]

[tool.pytest.ini_options]
testpaths = ["contracts/tests", "pipeline/tests", "server/tests", "tests"]
markers = ["latex: needs a pdflatex binary on PATH"]

# Scoped to the three src/ packages, so coverage is measured on library code
# only — no test file ever counts towards its own coverage.
[tool.coverage.run]
source = ["contracts/src", "pipeline/src", "server/src"]
