# The doc/ folder, as a site.
#
#     uv run --group docs mkdocs serve     live preview on http://localhost:8000
#     uv run --group docs mkdocs build     static HTML into site/
#
# Versions are pinned in pyproject.toml's `docs` group: MkDocs 1.x and Material
# 9.x. Material is what renders the mermaid fences and the theming below; a
# plain mkdocs theme would print the diagrams as code blocks.
site_name: ats-strike
site_description: Turn a job description into a tailored LaTeX CV, with any OpenAI-compatible model.
repo_url: https://github.com/gcontini/ats-strike
# Where the built site lives. mike needs it for the version selector's links.
site_url: https://gcontini.github.io/ats-strike/
docs_dir: doc

# Flat page/index.html folders buy nothing here — doc/ has no subfolders to
# begin with, so this just makes the built site match: architecture.html
# next to protocol.html, not architecture/index.html.
use_directory_urls: false

# A broken internal link fails the build rather than shipping.
strict: true

theme:
  name: material
  # doc/images/, not doc/icons/ — strict mode checks links, not asset paths,
  # so a wrong one here is a 404 on every page and a green build.
  logo: images/ats-strike-icon-128.png
  favicon: images/favicon.ico
  # Without this, Material's default repo icon is a generic git logo, not
  # the recognizable GitHub mark, even though repo_url already links there.
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.sections
    - content.code.copy

# The version selector in the header. mike publishes one built site per
# release to the gh-pages branch and maintains the versions.json this reads;
# `alias: true` is what makes the `latest` chip show next to the number.
# See doc/release.md.
extra:
  version:
    provider: mike
    alias: true
  analytics:
    provider: google
    property: G-3YNR617DVZ
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.

markdown_extensions:
  - toc: {permalink: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - ats-strike: index.md
  - How it works:
      - Architecture: architecture.md
      - The CV pipeline: cv-pipeline.md
      - A run, end to end: clipboard-flow.md
  - Using it:
      - The client: client.md
      - Running the two halves apart: deployment.md
      - Developing locally in VS Code: development-setup.md
  - Reference:
      - The HTTP API: protocol.md
      - Building the server: build-server.md
      - Model configurations: model-configurations.md
      - Building the client: build-client.md
      - Cutting a release: release.md
      - Credits: credits.md
