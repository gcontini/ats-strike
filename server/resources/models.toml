# ats-strike model configuration
# =============================
# ats-strike calls one model per job, all through the SAME provider — unless a
# model sets use_alternate_provider = N (N >= 2), in which case it calls
# provider N instead: [provider]'s variable names with N appended, e.g.
# MODEL_API_KEY2 / MODEL_BASE_URL2 for 2:
#
#   detect            JD detection: is the clipboard a job posting at all?
#   analysis          the JD analysis
#   letter            the cover letter
#
# and the six steps of a CV, in the order they run (doc/cv-pipeline.md):
#
#   jd_evaluation     the JD's key points, each with its importance
#   profile_scoring   every item of the profile scored against them
#   format_selection  the CV format, the experiences and their duty caps
#   cv                the CV body and each experience, written separately
#   validation        the body and each experience checked against the profile
#   highlight         the **bold**/*italic* keyword pass
#
# [provider] declares the endpoint once; each [models.*] table below is just
# the model name and generation settings for that job. Any OpenAI-compatible
# endpoint works — point base_url (or base_url_env) at it and set each model's
# `model` to whatever your account has access to.
#
# Docker: every key of a [models.<role>] table can be overridden with an env
# var, without touching this file — ATS_<ROLE>_<FIELD>, e.g.
# ATS_CV_MODEL, ATS_CV_TEMPERATURE, ATS_PROFILE_SCORING_API (roles:
# DETECT, ANALYSIS, LETTER, JD_EVALUATION, PROFILE_SCORING, FORMAT_SELECTION,
# CV, VALIDATION, HIGHLIGHT). An empty value drops the key, as if it were not
# declared here; ATS_<ROLE>_EXTRA_BODY is JSON and replaces the whole table.
# See .env.example.
#
# A client can do the same per request for every role but detect, with a
# <role>_extra_body part (e.g. cv_extra_body={"temperature": 0.7}). It
# supersedes ALL of the role's settings below — temperature, thinking,
# reasoning_effort, max_output_tokens, extra_body: only the model, the
# endpoint and what the client sent go out.
#
# Nothing checks that a combination makes sense for your endpoint: what a
# table declares is what is sent, and a request the endpoint refuses fails on
# its first call. The known traps are listed under the keys below.

[provider]
api_key_env  = "MODEL_API_KEY"
base_url_env = "MODEL_BASE_URL"

[defaults]
timeout_seconds = 600

# --- Per-model settings -------------------------------------------------
# model           (required) model name sent to the endpoint
# model_provider  "standard" (default: DashScope — Qwen and the DeepSeek models
#                 it hosts — OpenAI, OpenRouter, any OpenAI-compatible
#                 endpoint) | "deepseek" (DeepSeek's own api.deepseek.com)
# api             "chat_completions" (default) | "responses". DashScope's
#                 Responses endpoint ignored thinking budgets and stalled past
#                 600 s (2026-09-27); the Responses API has no presence_penalty,
#                 so a client that sends one fails there
# structured_output  how a JSON reply is asked for: "json_mode" (default; JSON
#                 but no schema — ats-strike puts the schema in the system prompt)
#                 | "json_schema" (strict schema in the request) |
#                 "function_calling" (a forced tool call). Native DeepSeek
#                 refuses a forced tool call while thinking, and turns
#                 json_schema into one: use json_mode there unless thinking = "off"
# temperature     sampling temperature; omit to use the provider default. DeepSeek
#                 ignores it, and presence_penalty, while thinking
# thinking        "auto" (send nothing — the provider decides, and the right
#                 value for endpoints without a thinking switch, e.g. OpenAI)
#                 | "on" | "off". The switch is the provider's own:
#                 enable_thinking (standard), thinking: {type} (deepseek)
# reasoning_effort  any string the provider accepts, sent as given (e.g. "low",
#                 "high"); omit for the provider default. Don't set it beside a
#                 thinking_budget on an endpoint that takes only one of them
# max_output_tokens  cap on the reply, thinking included; overrides
#                 [defaults].max_output_tokens. Omitted in both, the provider's
#                 own default applies
# extra_body      provider-specific request fields, sent as given, e.g.
#                 { thinking_budget = 6000 } (a cap on thinking tokens) or
#                 { enable_search = true } (DashScope's server-side web search)
# use_alternate_provider  which provider to call; default 1 ([provider]).
#                 N >= 2 calls MODEL_API_KEY<N> / MODEL_BASE_URL<N> instead;
#                 those are needed only when some model uses them

# Small and cheap: answers YES or NO to "is this a job description?". Runs on
# every clipboard change that passes the free structural checks, so it gets
# no thinking and a tiny budget — the verdict is one word.
# temperature = 0: a classifier that samples can file the same posting under
# errors one time in a few. No client can change it — /v1/jd/detect takes no
# temperature; only ATS_DETECT_TEMPERATURE on the server does.
[models.detect]
model                  = "deepseek-flash"
model_provider         = "deepseek"
use_alternate_provider = 2
temperature            = 0.0
max_output_tokens      = 1000
thinking               = "off"

# Extracts the JD analysis, and looks distances and company facts up on the web
# when the preferences ask for them. OpenAI (MODEL_API_KEY3 / MODEL_BASE_URL3)
# on the Responses API, in pro mode.
[models.analysis]
model                  = "gpt-6-luna"
use_alternate_provider = 3
api                    = "responses"
structured_output      = "json_schema"
temperature            = 1
extra_body             = { reasoning = { mode = "pro", effort = "xhigh" } }

# Writes the cover letter, and looks the employer up on the web for its
# why-this-company paragraph. OpenAI on Chat Completions.
[models.letter]
model                  = "gpt-6-luna"
use_alternate_provider = 3
temperature            = 1
thinking               = "auto"
reasoning_effort       = "xhigh"

# The six steps of a CV, as adapticv-ai ran them: DeepSeek V4.1 Flash on
# DeepSeek's own API (MODEL_API_KEY2 / MODEL_BASE_URL2), reasoning effort as
# in its bench of 2026-10-19 — 3.5 to 5.9 minutes and about 230k tokens a CV.
# No temperature: DeepSeek ignores it while thinking. The cv and validation
# roles each serve two prompts, the body's and the experiences'. Every reply
# is JSON asked for by its prompt (structured_output does not apply), except
# validation's, which are calls of a replace_in_* tool.
[models.jd_evaluation]
model                  = "deepseek-flash"
model_provider         = "deepseek"
use_alternate_provider = 2
reasoning_effort       = "medium"

# One call per list of the profile, all at once.
[models.profile_scoring]
model                  = "deepseek-flash"
model_provider         = "deepseek"
use_alternate_provider = 2
reasoning_effort       = "high"

[models.format_selection]
model                  = "deepseek-flash"
model_provider         = "deepseek"
use_alternate_provider = 2
reasoning_effort       = "medium"

# The body, and one call per experience shown, all at once.
[models.cv]
model                  = "deepseek-flash"
model_provider         = "deepseek"
use_alternate_provider = 2
reasoning_effort       = "medium"

# Up to five rounds per document; the documents are checked at once.
[models.validation]
model                  = "deepseek-flash"
model_provider         = "deepseek"
use_alternate_provider = 2
reasoning_effort       = "medium"

[models.highlight]
model                  = "deepseek-flash"
model_provider         = "deepseek"
use_alternate_provider = 2
reasoning_effort       = "medium"
