[project]
name = "ats-strike-server"
version = "1.1.0"
description = "ats-strike HTTP API: the protocol (packs, sessions, SSE) in front of the CV pipeline."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "ats-strike-contracts",
    # Everything that makes a CV: models, LangGraph, LaTeX, templating.
    "ats-strike-pipeline",
    # Web layer. uvicorn plain, not [standard]: no uvloop/httptools/websockets.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Required for File()/Form() parts — FastAPI raises without it.
    "python-multipart>=0.0.9",
]

[project.scripts]
ats-strike = "cv_server.server:main"

[tool.uv.sources]
ats-strike-contracts = { workspace = true }
ats-strike-pipeline = { workspace = true }

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = [
    "cv_server",
    "cv_server.api",
    "cv_server.api.routers",
]
